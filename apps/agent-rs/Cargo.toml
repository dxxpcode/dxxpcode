[package]
name = "dxxpcode-agent"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "dxxpcode"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ureq = { version = "3", features = ["json"] }
libc = "0.2"
sha1 = "0.10"
rand = "0.8"
chrono = "0.4"
tungstenite = "0.26"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
