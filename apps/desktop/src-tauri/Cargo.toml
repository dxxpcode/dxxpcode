[package]
name = "dxxpcode-desktop"
version = "0.2.5"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.13.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-opener = "=2.5.0"
serde_json = "1.0.151"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
