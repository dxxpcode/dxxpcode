name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-latest
          - os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install JS deps
        run: |
          cd apps/desktop && npm ci --no-workspaces

      - name: Build CLI sidecar
        shell: bash
        run: ./apps/desktop/scripts/build-sidecar.sh

      - name: Build desktop bundle
        shell: bash
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run build
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: dxxpcode-desktop-${{ runner.os }}
          path: apps/desktop/src-tauri/target/release/bundle/

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      # Every matrix job emits the same latest.json (it references release
      # asset URLs, not local files), so publishing one copy is sufficient.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bundles/**/*.dmg
            bundles/**/*.dmg.sig
            bundles/**/*.app.tar.gz
            bundles/**/*.app.tar.gz.sig
            bundles/**/*.msi
            bundles/**/*.msi.sig
            bundles/**/*.exe
            bundles/**/*.exe.sig
            bundles/**/*.AppImage
            bundles/**/*.AppImage.sig
            bundles/**/*.deb
            bundles/latest.json
          fail_on_unmatched_files: false
